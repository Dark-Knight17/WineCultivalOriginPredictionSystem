<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Cultivar Predictor</title>
    <style>
        /* Simple embedded CSS for styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #722F37;
            /* Wine color */
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            /* Ensures padding doesn't affect width */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #722F37;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #5a252c;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🍷 Wine Origin Predictor</h1>

        <form action="/" method="POST">
            <div class="form-group">
                <label for="alcohol">Alcohol</label>
                <input type="number" step="0.01" name="alcohol" placeholder="e.g. 13.2" required>
            </div>

            <div class="form-group">
                <label for="malic_acid">Malic Acid</label>
                <input type="number" step="0.01" name="malic_acid" placeholder="e.g. 2.77" required>
            </div>

            <div class="form-group">
                <label for="ash">Ash</label>
                <input type="number" step="0.01" name="ash" placeholder="e.g. 2.51" required>
            </div>

            <div class="form-group">
                <label for="total_phenols">Total Phenols</label>
                <input type="number" step="0.01" name="total_phenols" placeholder="e.g. 1.28" required>
            </div>

            <div class="form-group">
                <label for="color_intensity">Color Intensity</label>
                <input type="number" step="0.01" name="color_intensity" placeholder="e.g. 4.38" required>
            </div>

            <div class="form-group">
                <label for="proline">Proline</label>
                <input type="number" step="0.01" name="proline" placeholder="e.g. 1050" required>
            </div>

            <button type="submit">Predict Cultivar</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

        <div class="footer">
            Wine Cultivar Predictor by Israel Pedro
        </div>
    </div>

</body>

</html>
